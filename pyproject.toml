[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cloudflare-sandbox"
version = "0.1.0"
description = "Cloudflare Containers terminal backend for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_cloudflare_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

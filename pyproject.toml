[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cloudflare-sandbox"
version = "0.1.0"
description = "Cloudflare Containers terminal backend for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/kiyo-e/hermes-cloudflare-sandbox"
Issues = "https://github.com/kiyo-e/hermes-cloudflare-sandbox/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_cloudflare_sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: Base image
# Publishes the sandbox runtime image (worker/container) to GitHub Container
# Registry so custom images can start FROM it:
#   FROM ghcr.io/<owner>/hermes-cloudflare-sandbox-base:<tag>@sha256:<digest>
# Tags: the git tag (v*) and `main`. Cloudflare cannot pull from GHCR directly;
# a custom image is built FROM this one and pushed by `wrangler deploy`.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - worker/container/**
      - .github/workflows/base-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# One run per ref at a time; a newer push cancels an older one, so a stale run
# never overwrites a mutable tag such as `main`.
concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    # Only main and release tags are published (also for manual runs), so tags
    # map one-to-one to refs and never need rewriting.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --platform linux/amd64 --tag base worker/container
      - name: Check the custom image contract
        run: worker/scripts/check-image.sh base
      - name: Push
        env:
          REF: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/hermes-cloudflare-sandbox-base
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          # main or a v* tag (see `if`); refuse anything Docker cannot tag as is.
          printf %s "$REF" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || { echo "untaggable ref: $REF"; exit 1; }
          docker tag base "$IMAGE:$REF"
          docker push "$IMAGE:$REF"
          docker tag base "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          echo "Pushed $(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$REF")" >> "$GITHUB_STEP_SUMMARY"
